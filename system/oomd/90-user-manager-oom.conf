# Installed to /etc/systemd/system/user@.service.d/90-oom.conf
#
# Puts systemd-oomd's memory-pressure monitoring back, one level lower than
# CachyOS put it. Nothing here is a relaxation: the limit is the same 80%
# cachyos-settings chose. Only the vantage point changes, and that is the
# entire point of the file.
#
# 90-no-swap-kill.conf switched pressure monitoring off on user-.slice. That
# slice is owned by root, while everything worth killing inside it is owned by
# the user. From `man 5 systemd.resource-control`, on ManagedOOMPreference=:
#
#   "When calculating candidates to relieve memory pressure, systemd-oomd will
#    only respect these extended attributes if the unit's cgroup is owned by
#    root, or if the unit's cgroup owner, and the owner of the monitored
#    ancestor cgroup are the same."
#
# Measured here:
#
#   root:root   /sys/fs/cgroup/user.slice/user-1000.slice
#   darriour    /sys/fs/cgroup/user.slice/user-1000.slice/user@1000.service
#   darriour    .../user@1000.service/session.slice/wayland-wm@hyprland.desktop.service
#
# So monitoring from user-1000.slice (root) means avoid/omit on any descendant
# (darriour) is thrown away, and the compositor stays a legal kill candidate no
# matter what it asks for. Monitoring from user@1000.service puts the monitor
# and the candidates under the same owner, and the xattr is honoured.
#
# This is a system unit even though it manages a user session, so the drop-in
# belongs under /etc/systemd/system -- not ~/.config/systemd/user. The directory
# does not exist until this is installed.
#
# Verify it is live:
#   systemctl show user@1000.service -p ManagedOOMMemoryPressure -p ManagedOOMMemoryPressureLimit
# and, the one that actually proves the protection works:
#   getfattr -d -m 'user.oomd' /sys/fs/cgroup/user.slice/user-1000.slice/user@1000.service/session.slice/wayland-wm@hyprland.desktop.service

[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
