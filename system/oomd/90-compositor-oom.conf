# Installed to
#   ~/.config/systemd/user/wayland-wm@hyprland.desktop.service.d/90-oom.conf
#
# Tells systemd-oomd to pick almost anything before it picks the desktop.
#
# This works ONLY in combination with 90-user-manager-oom.conf, which moves the
# monitored cgroup down to user@.service so that owner check passes. On its own
# this file is a no-op, and a convincing-looking one -- systemd sets the xattr,
# oomd reads it, and discards it because the monitor above is root-owned.
#
# It also only means something because apps no longer share this cgroup.
# hypr/config/lib.lua's L.app() wraps the heavy launches in `uwsm app --`, so
# Firefox and the terminal live in their own scopes under app.slice. Before that
# change, "avoid" was pointless in a different way: with the compositor holding
# every process on the machine there was no other candidate to prefer.
#
# ── avoid, not omit ─────────────────────────────────────────────────────────
# `avoid`  -> chosen only if there is no other viable candidate.
# `omit`   -> never chosen at all.
#
# `omit` sounds like the stronger promise and is the worse choice. If something
# inside the desktop is the actual leak -- waybar, swaync, awww-daemon -- omit
# leaves oomd unable to act on the one cgroup that matters. The machine then
# grinds until the kernel OOM killer steps in, and it picks by oom_score with no
# idea what a compositor is; Hyprland is a plausible victim. So omit does not
# reliably save the desktop, and it does forfeit the early reaction.
#
# With `avoid`, a Firefox scope gets killed first and the session survives. If
# the desktop genuinely is the thing consuming the memory, killing it is the
# correct answer -- that is a bug to fix, not a case to hide.
#
# Changing this later is one word.

[Service]
ManagedOOMPreference=avoid
