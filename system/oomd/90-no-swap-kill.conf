# Installed to /etc/systemd/system/user-.slice.d/90-no-swap-kill.conf
#
# Stops systemd-oomd killing the user session because zram swap is "full".
#
# Arch ships /usr/lib/systemd/system/user-.slice.d/10-oomd-per-slice-defaults.conf:
#
#     ManagedOOMSwap=kill
#     ManagedOOMMemoryPressure=kill
#     ManagedOOMMemoryPressureLimit=80%
#
# `ManagedOOMSwap=kill` means: when TOTAL system swap use passes
# SwapUsedLimit (default 90%), kill the monitored cgroup using the most swap.
# That rule is written for swap on a disk, where 90% full genuinely means the
# machine is about to wedge.
#
# This machine's only swap is zram -- compressed RAM, sized at 100% of RAM by
# /usr/lib/systemd/zram-generator.conf (`zram-size = ram`). So "swap 90% full"
# is not an emergency here, it is what a busy 8 GB laptop looks like. Pages get
# compressed in place; nothing is waiting on a disk.
#
# It fired twice and took the whole desktop down mid-work:
#
#   Sep 28 15:04:46  Marked .../wayland-wm@hyprland.desktop.service for killing
#                    due to memory used (7177072640) / total (7969300480) and
#                    swap used (7503994880) / total (7969173504) being more
#                    than 90.00%
#   Sep 29 11:42:06  ... swap used (7186481152) ... same unit, same result
#
# `auto` does not disable oomd -- it means "only act if an ancestor asked for
# it", and nothing does. ManagedOOMMemoryPressure=kill is deliberately LEFT
# ALONE: memory pressure (PSI) is the honest signal for "processes are stalling
# on memory", and it is the one worth acting on. Only the swap-percentage
# heuristic is switched off.
#
# 90- so it sorts after the 10- defaults; systemd orders drop-ins by filename
# across all directories, so the name matters more than the directory.

[Slice]
ManagedOOMSwap=auto
