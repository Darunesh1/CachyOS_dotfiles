# Installed to /etc/systemd/system/user-.slice.d/90-no-swap-kill.conf
#
# Turns OFF both of systemd-oomd's kill rules at this level. This slice is owned
# by root, and that is the whole problem -- see below and system/README.md.
#
# CachyOS ships /usr/lib/systemd/system/user-.slice.d/10-oomd-per-slice-defaults.conf
# (package: cachyos-settings, NOT plain Arch):
#
#     ManagedOOMSwap=kill
#     ManagedOOMMemoryPressure=kill
#     ManagedOOMMemoryPressureLimit=80%
#
# That file is also why systemd-oomd runs at all here. The service is `disabled`
# in the presets; it gets pulled in because a unit with ManagedOOM* settings
# gains an implicit dependency on it -- `systemctl show systemd-oomd -p WantedBy`
# reports WantedBy=user-1000.slice. On plain Arch neither this file nor
# zram-generator.conf exists, so oomd never starts, which is exactly why years
# of plain Arch on this laptop never produced a session kill.
#
# ── ManagedOOMSwap ──────────────────────────────────────────────────────────
# Fires when TOTAL swap use passes 90%, killing the monitored cgroup using the
# most swap. Sound advice for swap on a disk. This machine's swap was zram only
# -- compressed RAM, sized at 100% of RAM -- so "swap 90% full" described a busy
# 8 GB laptop, not an emergency. It fired twice and took the desktop with it:
#
#   Sep 28 15:04:46  Marked .../wayland-wm@hyprland.desktop.service for killing
#                    due to memory used (7177072640) / total (7969300480) and
#                    swap used (7503994880) / total (7969173504) being more
#                    than 90.00%
#   Sep 29 11:42:06  ... identical, swap used (7186481152)
#
# ── ManagedOOMMemoryPressure ────────────────────────────────────────────────
# Pressure (PSI) is the honest signal and is NOT being abandoned -- it is
# RELOCATED to user@.service by 90-user-manager-oom.conf. It has to move,
# because ManagedOOMPreference=avoid on the compositor is only respected when
# the monitored ancestor and the candidate share an owner, and they do not here:
#
#   root:root   /sys/fs/cgroup/user.slice/user-1000.slice          <- monitor
#   darriour    .../user@1000.service/session.slice/wayland-wm@... <- candidate
#
# Monitoring from this root-owned slice would silently ignore the xattr and keep
# the desktop a legal kill target. Monitoring from the user-owned
# user@1000.service honours it. `man 5 systemd.resource-control` spells this out
# under ManagedOOMPreference=.
#
# `auto` means "only act if an ancestor asked for it", and none does.
#
# 90- so it sorts after the 10- defaults; systemd orders drop-ins by filename
# across all directories, so the name matters more than the directory.

[Slice]
ManagedOOMSwap=auto
ManagedOOMMemoryPressure=auto
