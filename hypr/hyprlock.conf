# ═══════════════════════════════════════════════════════════════════════════
#  hyprlock.conf  —  Minimalist Lock Screen
# ═══════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/hyprlock-colors.conf

# Six options were removed here on 2026-11-09 because hyprlock 0.9.7 does not
# have them and threw them away on every single lock:
#
#   general:no_fade_in   general:no_fade_out   general:grace
#   general:disable_loading   input-field:fail_transition
#   input-field:capslock_nb_text
#   -> "Proceeding ignoring faulty entries"
#
# Checked against hyprlock's src/config/ConfigManager.cpp rather than guessed:
# `general` registers only text_trim, hide_cursor, ignore_empty_input,
# immediate_render, compositor_fade, fractional_scaling, screencopy_mode,
# fail_timeout and disable_screencopy.
general {
    hide_cursor       = true
    text_trim         = true

    # Draw the lock screen at once instead of waiting for the first frame.
    # Relevant here: the complaint this file was audited for was a lock screen
    # that showed for a moment and then went black.
    immediate_render  = true
}

# ── Background — clear current wallpaper ────────────────────────────────────
background {
    monitor     =
    path        = /home/darriour/Pictures/Wallpaper/current_wallpaper
    blur_passes = 0
    brightness  = 1.0
    contrast    = 1.0
}

# ── Clock — large 24h time, centered above password ─────────────────────────
label {
    monitor       =
    text          = $TIME
    color         = $foreground
    font_family   = JetBrainsMono Nerd Font
    font_size     = 88
    position      = 0, 100
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(00000088)
}

# ── Password input field — center ───────────────────────────────────────────
input-field {
    monitor             =
    size                = 280, 48

    outline_thickness   = 0
    dots_size           = 0.28
    dots_spacing        = 0.18
    dots_center         = true
    dots_rounding       = -1

    outer_color         = rgba(00000000)
    inner_color         = $background
    font_color          = $foreground

    check_color         = $color10
    fail_color          = $color9
    fail_text           = "󰍹  wrong password"

    capslock_color      = $color11

    fade_on_empty       = true
    placeholder_text    = '<span foreground="##5c6370"><i>  enter password</i></span>'
    hide_input          = false
    rounding            = 12

    position            = 0, 0
    halign              = center
    valign              = center
}

# ── Battery — centered below password ───────────────────────────────────────
label {
    monitor       =
    text          = cmd[update:30000] bash -c 'BAT=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); STATUS=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); if [ -z "$BAT" ]; then exit 0; fi; if [ "$STATUS" = "Charging" ]; then ICON="󰂄"; elif [ "$BAT" -ge 90 ]; then ICON="󰁹"; elif [ "$BAT" -ge 70 ]; then ICON="󰂀"; elif [ "$BAT" -ge 50 ]; then ICON="󰁾"; elif [ "$BAT" -ge 30 ]; then ICON="󰁼"; elif [ "$BAT" -ge 15 ]; then ICON="󰁺"; else ICON="󰂃"; fi; echo "$ICON  $BAT%"'
    color         = $foreground
    font_family   = JetBrainsMono Nerd Font
    font_size     = 14
    position      = 0, -80
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_color  = rgba(00000088)
}
