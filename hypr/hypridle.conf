general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspending
    # Turn the screen on when waking up, then undo a deliberate zero-brightness.
    # swayosd/config.toml sets min_brightness = 0 so the Fn key can reach a
    # black screen; without this you would wake to a black panel.
    #
    # Two things here are easy to get wrong and were measured, not guessed:
    #
    # 1. The dispatcher syntax. This Hyprland runs the Lua config plugin, where
    #    `hyprctl dispatch dpms on` fails outright:
    #      error: [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
    #    and exits 7. It had been failing silently here. The working form is
    #    `hyprctl dispatch 'hl.dsp.dpms("on")'`, which returns `ok`.
    #
    # 2. `;` not `&&`. Chained with &&, any future failure of the dpms call
    #    would skip the brightness restore and leave you on a black screen --
    #    exactly what happened while testing the broken syntax above.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' ; ~/.config/hypr/scripts/display/brightness-floor.sh
}

# 1. Lock the screen after 5 minutes (300 seconds)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    # Covers the 300-330 s gap: locked but not suspended yet, so after_sleep_cmd
    # never fires. Coming back to the machine in that window restores the floor.
    on-resume = ~/.config/hypr/scripts/display/brightness-floor.sh
}

# 2. Put the computer to sleep right after locking (e.g., 330 seconds)
listener {
    timeout = 330
    on-timeout = systemctl suspend
}
