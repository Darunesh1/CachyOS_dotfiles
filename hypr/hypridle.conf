# ═══════════════════════════════════════════════════════════════════════════
#  hypridle.conf  —  idle staircase
# ═══════════════════════════════════════════════════════════════════════════
#
# Shaped after hyprwm/hypridle's own assets/example.conf, because the previous
# version of this file skipped the screen-off step entirely and suspended the
# whole machine after 5.5 minutes. Compared when it was rewritten:
#
#   stage            upstream   JaKooLit          HyDE    was here
#   dim backlight     150 s      --                60 s    absent
#   lock              300 s      600 s            120 s     300 s
#   DPMS off          330 s      630 s (off)      300 s    ABSENT
#   suspend          1800 s     1200 s (off)      500 s     330 s
#
# Every reference turns the display off and suspends much later. Going straight
# from locked to full suspend in 5.5 minutes meant every coffee break was a
# suspend, and every suspend risked the lock-screen bugs below.

general {
    # The `pidof` guard stays: two hyprlock instances fighting over the single
    # session-lock surface is itself a way to get a black screen, and that is
    # exactly what used to happen -- hyprlock logged
    # "onLockFinished called. Seems we got yeeten. Is another lockscreen
    # running?" on every lid close, because scripts/display/lid-close.sh
    # started a second one. That line is now gone from lid-close.sh, making
    # this the ONLY thing that starts hyprlock.
    #
    # Braces matter: without them `pidof hyprlock || mkdir ...; hyprlock` runs
    # hyprlock unconditionally, and a missing state directory would make the
    # redirect fail and hyprlock never start at all -- no lock screen.
    lock_cmd = pidof hyprlock || { mkdir -p $HOME/.local/state/hypr; hyprlock >>$HOME/.local/state/hypr/hyprlock.log 2>&1; }

    before_sleep_cmd = loginctl lock-session    # lock before suspending

    # ── READ THIS BEFORE TOUCHING THE DPMS ARGUMENT ────────────────────────
    #
    # The argument form is NOT cosmetic. Measured on this build, from a panel
    # that was on (`hyprctl monitors -j | jq '.[0].dpmsStatus'` -> true):
    #
    #   hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   -> true   (correct)
    #   hyprctl dispatch 'hl.dsp.dpms({action = "off"})'  -> false  (correct)
    #   hyprctl dispatch 'hl.dsp.dpms("on")'              -> FALSE  (!!)
    #
    # The positional string form TURNS THE DISPLAY OFF, whatever string is
    # passed. It was in this file from 2026-11-07 (commit e75ea32) to
    # 2026-11-09 and blanked the screen on every single resume -- the real
    # cause of "the picture appears for a second, then black".
    #
    # It was justified at the time because `hyprctl dispatch` printed `ok`.
    # `ok` is worthless here: `hl.dsp.dpms()` with no arguments and
    # `hl.dsp.dpms("bogus")` both print `ok` too. The ONLY valid check is
    # reading `dpmsStatus` back out of `hyprctl monitors -j`.
    #
    # The form before that, `hyprctl dispatch dpms on`, failed outright under
    # the Lua config plugin --
    #   error: [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
    # -- exiting 7 and doing nothing, which is why resumes worked before Nov 7.
    #
    # `;` not `&&` between the three commands: a failure in any one of them
    # must never skip the two that follow.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' ; ~/.config/hypr/scripts/display/brightness-floor.sh ; ~/.config/hypr/scripts/display/panel-rescue.sh
}

# 1. Dim the backlight at 2.5 min as a warning that the lock is coming.
#    `-s` saves the current value and `-r` restores it, so coming back gives
#    you the brightness you actually had. This does not fight
#    brightness-floor.sh, which only ever raises a backlight below 5%.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2. Lock at 5 min.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    # Covers the gap where the session is locked but not suspended, so
    # after_sleep_cmd never fires. Coming back in that window restores the
    # brightness floor.
    on-resume = ~/.config/hypr/scripts/display/brightness-floor.sh
}

# 3. Screen off at 5.5 min -- the step this file never had. The machine stays
#    awake and everything keeps running; only the panel is powered down.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 4. Suspend at 30 min, matching upstream. This was 330 s, which is why the
#    machine suspended several times a day.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
