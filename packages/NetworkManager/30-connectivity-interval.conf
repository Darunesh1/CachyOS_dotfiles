# Re-check internet reachability every 60 s instead of NetworkManager's default
# 300 s, so waybar's "no internet" badge (waybar/scripts/internet-status.sh)
# notices a drop mid-session within a minute. One tiny HTTP request per check.
# The check URL itself comes from /usr/lib/NetworkManager/conf.d/20-connectivity.conf.
#
# Installed by install.sh (stage 8) to /etc/NetworkManager/conf.d/.

[connectivity]
interval=60
